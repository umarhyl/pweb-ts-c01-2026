<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login petugas antrean Rumah Sakit C-01">
  <title>Masuk Petugas | RS C-01</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/xp.css">
  <script src="js/login.js" defer></script>
</head>
<body class="login-body xp-page">
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-header">
        <p class="login-brand">✚ C-01 <span>/ akses petugas</span></p>
        <h2 id="login-title">Masuk Petugas</h2>
        <p class="subtitle">Admin dan moderator masuk ke Dashboard Admin. Akun user masuk ke Panel Operator. Pasien dapat mengambil nomor tanpa login.</p>
      </div>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="contoh: emilys" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <p id="error-message" class="error-msg" role="alert" aria-live="polite"></p>
        <button id="login-button" class="login-btn" type="submit">Masuk <span>→</span></button>
      </form>
      <p class="login-home"><a href="beranda.html">← Kembali ke beranda</a></p>
    </section>
  </main>
</body>
</html>
